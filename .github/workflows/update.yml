name: Uppdatera data och publicera

on:
  schedule:
    # Varje dag 05:00 UTC (insynshandel uppdateras dagligen, fonddata kvartalsvis)
    - cron: "0 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Bygg om alla kvartal"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # GitHub stänger av schemalagda körningar i publika repon efter 60 dagar utan aktivitet.
  # Att aktivera arbetsflödet på nytt varje vecka nollställer den räknaren.
  keepalive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Håll det schemalagda arbetsflödet aktivt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # Hela historiken, så att datasteget kan göra rebase om någon pushat under körningen
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # FI:s zip-filer sparas mellan körningar så att bara nya kvartal laddas ner
      - uses: actions/cache@v6
        with:
          path: .cache
          key: fi-zips-${{ github.run_id }}
          restore-keys: fi-zips-

      # pdftotext läser målbolag, pris och premie ur erbjudandehandlingarna.
      # rsvg-convert och typsnittet Roboto ritar delningsbilderna.
      - name: Installera verktyg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils librsvg2-bin
          sudo apt-get install -y -qq fonts-roboto || echo "Roboto saknas, bilderna använder DejaVu Sans"

      - name: Hämta fondinnehav från FI
        shell: pwsh
        run: |
          $force = "${{ inputs.force }}" -eq "true"
          ./scripts/build-data.ps1 -History 4 -Force:$force

      # Fondernas räntepapper och fondandelar (byggs om när FI publicerar nytt) och Riksbankens räntor (varje dag)
      - name: Bygg räntedata
        shell: pwsh
        continue-on-error: true
        run: ./scripts/build-rates.ps1

      # Antal aktier per bolag från Nasdaq (för fondernas ägarandel). Högst 60 aktier per körning, varje aktie en gång i månaden.
      - name: Hämta antal aktier
        shell: pwsh
        continue-on-error: true
        run: ./scripts/build-shares.ps1

      # "Känn bolaget" på aktiesidan: senaste kvartalsrapporten och kalendern från MFN, affärsområden, marknader och
      # helåret ur årsredovisningarna (ESEF). Nya rapporter hämtas när de kommer, resten sparas i repot.
      # pypdfium2 läser kvartalsrapporternas PDF:er.
      - name: Bygg bolagsfakta
        id: bolag
        continue-on-error: true
        timeout-minutes: 25
        run: |
          python3 -m pip install --user --break-system-packages -q pypdfium2==5.1.0
          python3 scripts/build-companies.py --health "$RUNNER_TEMP/bolag-health.json"

      # Larm: slutar hämtningen eller läsningen av rapporterna att fungera öppnas ett ärende på GitHub (GitHub mejlar),
      # och det stängs när det fungerar igen. Stoppar aldrig publiceringen.
      - name: Larm om bolagsfakta
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.bolag.outcome }}
        run: bash scripts/company-alarm.sh "$RUNNER_TEMP/bolag-health.json"

      # Spararnas nettoflöden per fondtyp (Fondbolagens förening, månadsvis) och uppskattade flöden per fond (ur FI-datan)
      - name: Bygg fondsparandet
        shell: pwsh
        continue-on-error: true
        run: ./scripts/build-flows.ps1

      # Blankning byggs varje gång men sparas inte i repot (den ändras dagligen)
      - name: Hämta blankning från FI
        shell: pwsh
        continue-on-error: true
        run: ./scripts/build-shorts.ps1

      # Insynshandel från FI:s insynsregister (ändras dagligen, sparas inte i repot)
      - name: Hämta insynshandel från FI
        shell: pwsh
        continue-on-error: true
        run: ./scripts/build-insider.ps1

      # Avkastning från Pensionsmyndighetens öppna fonddata (uppdateras varje vecka)
      - name: Hämta avkastning från Pensionsmyndigheten
        shell: pwsh
        continue-on-error: true
        run: ./scripts/build-perf.ps1

      - name: Skapa utkast till nyhetsbrev vid nytt kvartal
        shell: pwsh
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: ./scripts/newsletter.ps1

      # Stoppar körningen om datan ser fel ut, så att ingen trasig data sparas eller publiceras
      - name: Kontrollera datan
        shell: pwsh
        run: ./scripts/validate-data.ps1

      # Bevakningsmejl via Buttondown. Utkast tills variabeln ALERTS_SEND är "true" (Settings > Variables)
      - name: Skicka bevakningsmejl
        shell: pwsh
        continue-on-error: true
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          ALERTS_SEND: ${{ vars.ALERTS_SEND }}
        run: ./scripts/alerts.ps1

      # Om någon pushat medan körningen pågick hämtas de ändringarna först (rebase), med några nya försök
      - name: Spara ny data i repot
        run: |
          if [ -n "$(git status --porcelain site/data data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data data
            git commit -m "Uppdatera fondinnehav från FI"
            for i in 1 2 3 4; do
              if git pull --rebase -q origin main && git push -q origin HEAD:main; then break; fi
              if [ "$i" = 4 ]; then echo "Kunde inte spara datan"; exit 1; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 10))
            done
          else
            echo "Ingen ny data."
          fi

      # Unik version i länkarna till CSS/JS så att webbläsare hämtar nya filer direkt
      - name: Sätt versionsnummer på filerna
        run: |
          v=$(git rev-parse --short HEAD)
          sed -i "s/__VERSION__/$v/g" site/index.html site/assets/app.js
          sed -i "s/__YEAR__/$(date +%Y)/g" site/index.html
          echo "$v" > site/version.txt

      # En fast sida per aktie, fond och fondbolag för sökmotorer, delningsbilder, sitemap och robots.txt.
      # Utgår från site/index.html och körs därför efter versionsnumret. Misslyckas steget publiceras
      # ingenting, så att den förra versionen med alla sidor ligger kvar i stället för en sajt utan dem.
      - name: Bygg sidor för sökmotorer och delningsbilder
        shell: pwsh
        run: ./scripts/build-pages.ps1 -WriteHome

      # Datasetet som release på GitHub, en gång per kvartal (data-2026Q2 osv.)
      - name: Publicera datasetet som release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          q=$(python3 -c "import json; print(json.load(open('site/data/index.json'))['quarters'][0]['id'])")
          zip="site/data/dataset/fondinsyn-dataset-$q.zip"
          if [ -f "$zip" ] && ! gh release view "data-$q" >/dev/null 2>&1; then
            gh release create "data-$q" "$zip" site/data/dataset/README.md --title "Fondinsyn dataset $q" --notes-file site/data/dataset/README.md
          else
            echo "Release data-$q finns redan eller datasetet saknas"
          fi

      # Kvartalsrapporterna som PDF (Chrome skriver ut rapportsidorna). Misslyckas det länkar sajten till webbversionen.
      - name: Skriv ut kvartalsrapporterna som PDF
        continue-on-error: true
        run: bash scripts/build-pdf.sh site

      # Röktest: Chrome öppnar sajtens viktigaste sidor. Ritas en sida inte, eller får sajtens skript ett fel,
      # stoppas publiceringen och gårdagens version ligger kvar.
      - name: Röktest av sajten
        run: bash scripts/smoke-test.sh site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
